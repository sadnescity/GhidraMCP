// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.
plugins {
	id 'java'
	id 'eclipse'
	id 'idea'
}

def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
} else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
    apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
} else {
	throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}

repositories {
	mavenCentral()
}

// Gson alone, for the bridge jar (the extension's classpath also has Ghidra's lib/).
configurations {
	bridge
}

dependencies {
	implementation 'com.google.code.gson:gson:2.10.1'
	bridge 'com.google.code.gson:gson:2.10.1'

	testImplementation 'junit:junit:4.13.2'
}

// The extension zip is built by copying the whole project directory, so
// anything a developer leaves lying around ships inside it.
buildExtension {
	exclude '.claude/**'
	exclude '.github/**'
}

// The tool catalog, generated from the @Tool annotations, bundled into the
// bridge jar so it can list tools before any Ghidra runs.
def catalogDir = layout.buildDirectory.dir('generated/catalog')
tasks.register('generateCatalog', JavaExec) {
	dependsOn 'compileJava'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.lauriewired.core.SchemaDump'
	args catalogDir.get().file('mcp-tools.json').asFile.absolutePath
	outputs.dir catalogDir
	inputs.files sourceSets.main.output.classesDirs
}

// The extension is the Ghidra side only; the MCP server is the bridge jar.
jar {
	exclude 'com/lauriewired/mcp/**'
}

// The MCP server: com.lauriewired.mcp, the catalog and Gson in one jar, no
// Ghidra classes. MCP clients start it (the Claude Code plugin ships it):
//     java -jar ghidra-mcp-bridge.jar
//
// Ghidra's build compiles the extension for the Java Ghidra runs on (25 for
// 12.2). The bridge runs on whatever `java` the client finds, so it is
// compiled on its own for Java 21: it uses nothing but the JDK and Gson.
def bridgeClasses = layout.buildDirectory.dir('bridge-classes')
tasks.register('compileBridge', JavaCompile) {
	source = fileTree('src/main/java') { include 'com/lauriewired/mcp/**' }
	classpath = configurations.bridge
	destinationDirectory = bridgeClasses
	options.release = 21
	options.encoding = 'UTF-8'
}
tasks.register('bridgeJar', Jar) {
	dependsOn 'generateCatalog', 'compileBridge'
	archiveFileName = 'ghidra-mcp-bridge.jar'
	destinationDirectory = file('dist')
	from(bridgeClasses)
	from(catalogDir)
	from({ configurations.bridge.collect { zipTree(it) } }) {
		exclude 'META-INF/**', 'module-info.class'
	}
	manifest {
		attributes('Main-Class': 'com.lauriewired.mcp.StdioMain')
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
buildExtension.dependsOn 'bridgeJar'
